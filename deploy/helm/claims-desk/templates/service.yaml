apiVersion: v1
kind: Service
metadata:
  name: {{ include "claims-desk.name" . }}-api
  labels:
    {{- include "claims-desk.labels" . | nindent 4 }}
  {{- with .Values.service.loadBalancerIP }}
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ . | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "claims-desk.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
