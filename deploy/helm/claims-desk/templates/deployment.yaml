{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claims-desk.name" . }}-api
  labels:
    {{- include "claims-desk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "claims-desk.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "claims-desk.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        apptier: api
      annotations:
        claims-desk/secret-hash: {{ .Values.secretHash | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: docs
          persistentVolumeClaim:
            claimName: {{ include "claims-desk.docsVolume" . }}
      containers:
        # Middleware: the only database client. Calls the docs container on localhost.
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, claimsdesk.api:app, --host, 0.0.0.0, --port, "8000", --no-server-header]
          ports:
            - {name: api, containerPort: 8000}
          env:
            - {name: CLAIMS_STAGE, value: {{ .Values.stage | quote }}}
            - {name: CLAIMS_DB_HOST, value: {{ required "db.host is required" .Values.db.host | quote }}}
            - {name: CLAIMS_DB_PORT, value: {{ .Values.db.port | quote }}}
            - {name: CLAIMS_DB_NAME, value: {{ .Values.db.name | quote }}}
            - {name: CLAIMS_DB_USER, value: {{ .Values.db.user | quote }}}
            - {name: CLAIMS_DB_SSLMODE, value: {{ .Values.db.sslmode | quote }}}
            - {name: CLAIMS_DB_SCHEMA, value: {{ .Values.db.schema | quote }}}
            - name: CLAIMS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: db-password}
            - {name: CLAIMS_DOCS_URL, value: "http://127.0.0.1:8090"}
            - {name: CLAIMS_DOCS_TIMEOUT, value: "60"}
            {{- include "claims-desk.downward" . | nindent 12 }}
          # TCP only: a database outage must reach the portal as "Database unavailable",
          # not take the pods out of the Service.
          readinessProbe:
            tcpSocket: {port: api}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: api}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        # Document role: photo to Files (NFSv3), accepted packet to Objects.
        - name: docs
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, claimsdesk.docs:app, --host, 0.0.0.0, --port, "8090", --no-server-header]
          ports:
            - {name: docs, containerPort: 8090}
          env:
            - {name: CLAIMS_STAGE, value: {{ .Values.stage | quote }}}
            - {name: CLAIMS_NFS_EXPORT, value: {{ printf "%s:%s" .Values.nfs.server .Values.nfs.path | quote }}}
            - {name: CLAIMS_NFS_MOUNT, value: {{ .Values.nfs.mountPath | quote }}}
            - {name: CLAIMS_S3_ENDPOINT, value: {{ required "s3.endpoint is required" .Values.s3.endpoint | quote }}}
            - {name: CLAIMS_S3_BUCKET, value: {{ .Values.s3.bucket | quote }}}
            - {name: CLAIMS_S3_REGION, value: {{ .Values.s3.region | quote }}}
            - {name: CLAIMS_S3_VERIFY_TLS, value: "false"}
            - name: CLAIMS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-access-key}
            - name: CLAIMS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-secret-key}
            {{- include "claims-desk.downward" . | nindent 12 }}
          volumeMounts:
            - {name: docs, mountPath: {{ .Values.nfs.mountPath | quote }}}
          readinessProbe:
            httpGet: {path: /health, port: docs}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: docs}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.docs | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
