#cloud-config
# Claims Desk portal VM: Rocky Linux 9 (or RHEL 9) cloud image on AHV.
#
# Prism Central: Create VM > Guest Customization > Cloud-init (Linux) > Custom Script,
# paste this file. Edit the values marked EDIT. The VM updates itself, installs what
# install.sh needs, disables firewalld and SELinux, and reboots once. Then copy the
# Claims Desk bundle to it and run sudo ./install.sh.
#
# Progress on the VM: sudo tail -f /var/log/cloud-init-output.log
# Done when the VM has rebooted and /var/lib/claims-desk/vm-ready exists.

hostname: portal01                          # EDIT
fqdn: portal01.claims.example               # EDIT
prefer_fqdn_over_hostname: true
manage_etc_hosts: true
timezone: Australia/Sydney                  # EDIT if needed

# The image's default user (rocky on Rocky Linux, cloud-user on RHEL) gets this key and sudo.
# Lab key: deploy/ssh/claims-desk-lab.pub (private key on the admin laptop only).
users:
  - default
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGfO43mMt4kOUNA2UA2fykY4gWVU3WyXK9WY+cw8WGIa claims-desk-lab (maksim.malygin@nutanix.com)
ssh_pwauth: false
# Console password for the default user (optional; hash with: openssl passwd -6):
# chpasswd:
#   expire: false
#   users:
#     - {name: rocky, password: "$6$...", type: HASH}

package_update: true
package_upgrade: true
packages:
  # Used by install.sh (it skips dnf when these are present)
  - nginx
  - python3.11
  - python3.11-pip
  - openssl
  - tar
  # Demo and troubleshooting
  - postgresql          # psql client, to show the claims table and test the DB login
  - nmap-ncat           # nc -vz <db-host> 5432
  - bind-utils          # dig, nslookup
  - jq                  # curl -sk https://localhost/api/v1/info | jq
  - chrony
  - git
  - rsync
  - vim-enhanced

write_files:
  - path: /etc/profile.d/claims-desk.sh
    permissions: "0644"
    content: |
      # Claims Desk demo VM
      alias cdlog='sudo journalctl -u claims-api -u claims-web -u nginx -f'
  # Optional: download the offline bundle at first boot. Set BUNDLE_URL to an address the
  # VM can reach without credentials (internal web server, Objects pre-signed URL).
  # The GitHub repository is private, so its release URL needs a token: copy the bundle
  # with scp instead.
  - path: /usr/local/sbin/claims-desk-fetch-bundle
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      BUNDLE_URL=""                         # EDIT (optional)
      [ -n "$BUNDLE_URL" ] || { echo "no BUNDLE_URL set; copy the bundle with scp"; exit 0; }
      dest=/opt/claims-desk-bundle
      mkdir -p "$dest"
      curl -fsSL --retry 3 "$BUNDLE_URL" -o /tmp/claims-desk-bundle.tar.gz
      tar -xzf /tmp/claims-desk-bundle.tar.gz -C "$dest"
      rm -f /tmp/claims-desk-bundle.tar.gz
      echo "bundle extracted to $dest; run: cd $dest/claims-desk-demo-* && sudo ./install.sh"

runcmd:
  # SELinux: off now, and off after the reboot. On RHEL 9 the config file alone leaves
  # SELinux loaded without a policy; the selinux=0 kernel argument disables it fully.
  - [sh, -c, "setenforce 0 || true"]
  - [sed, -i, "s/^SELINUX=.*/SELINUX=disabled/", /etc/selinux/config]
  - [grubby, --update-kernel, ALL, --args, selinux=0]
  # Firewall: stop and mask firewalld (cloud images may not ship it; both steps tolerate that).
  - [sh, -c, "systemctl disable --now firewalld 2>/dev/null || true"]
  - [systemctl, mask, firewalld]
  - [systemctl, enable, --now, chronyd]
  - [/usr/local/sbin/claims-desk-fetch-bundle]
  - [mkdir, -p, /var/lib/claims-desk]
  - [sh, -c, "date -Is > /var/lib/claims-desk/vm-ready"]

# Reboot once, to load the updated kernel and boot with selinux=0.
power_state:
  mode: reboot
  delay: now
  message: "Claims Desk VM prepared; rebooting"
  timeout: 60
  condition: true
