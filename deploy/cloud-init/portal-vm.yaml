#cloud-config
# Claims Desk portal VM: Rocky Linux 9 (or RHEL 9) cloud image on AHV.
#
# Prism Central: Create VM > Guest Customization > Cloud-init (Linux) > Custom Script,
# paste this file. Edit the values marked EDIT. The VM updates itself, installs what
# install.sh needs, disables firewalld and SELinux, and reboots once. Then copy the
# Claims Desk bundle to it and run sudo ./update.sh --stage 1 (or sudo ./install.sh).
# Stage 3, from this same bundle: sudo ./update.sh --stage 3.
#
# Progress on the VM: sudo tail -f /var/log/cloud-init-output.log
# Done when the VM has rebooted and /var/lib/claims-desk/vm-ready exists. If the bundle
# download fails, vm-ready is missing and /var/lib/claims-desk/bundle-failed says why.

hostname: portal01                          # EDIT
fqdn: portal01.ntnxlab.local                # EDIT
prefer_fqdn_over_hostname: true
manage_etc_hosts: true
timezone: Australia/Sydney                  # EDIT if needed

# DNS is the Windows Server at 10.55.19.6, search domain ntnxlab.local. It is pinned in
# the guest so subnet DHCP cannot replace it. Time comes from lab01.
ntp:
  enabled: true
  ntp_client: chrony
  servers:
    - 10.10.110.50                          # EDIT: lab01
  pools:
    - 2.rocky.pool.ntp.org                  # fallback

