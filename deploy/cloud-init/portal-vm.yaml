# SSH: the lab key works for the default user (rocky on Rocky Linux, cloud-user on RHEL)
# and for root. Password logins are on, root included. Lab only.
# Lab key: deploy/ssh/claims-desk-lab.pub (private key on the admin laptop only).
users:
  - default
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGfO43mMt4kOUNA2UA2fykY4gWVU3WyXK9WY+cw8WGIa claims-desk-lab (maksim.malygin@nutanix.com)
disable_root: false
ssh_pwauth: true

# Root password, SHA-512 crypt. New hash: openssl passwd -6 (on Linux)
chpasswd:
  expire: false
  users:
    - name: root
      password: "$6$w/K1REnMsGO1qqc/$kd9P7P.wpEhKGjFrh/o/nGSiZg8NbYDSCLq.Q0NeJvTlwPEHzcHETdMwABQVPYVufA3HVLA68vobrrRTvRf2N/"
      type: hash

package_update: true
package_upgrade: true
packages:
  # Used by install.sh (it skips dnf when these are present)
  - nginx
  - python3.11
  - python3.11-pip
  - openssl
  - tar
  # Demo and troubleshooting
  - postgresql          # psql client, to show the claims table and test the DB login
  - nmap-ncat           # nc -vz <db-host> 5432
  - bind-utils          # dig, nslookup
  - jq                  # curl -sk https://localhost/api/v1/info | jq
  - chrony
  - git
  - rsync
  - vim-enhanced

write_files:
  # sshd reads drop-ins in name order and keeps the first value, so 01- overrides the
  # image's prohibit-password default for root.
  - path: /etc/ssh/sshd_config.d/01-claims-desk-lab.conf
    permissions: "0600"
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
  - path: /etc/profile.d/claims-desk.sh
    permissions: "0644"
    content: |
      # Claims Desk demo VM
      alias cdlog='sudo journalctl -u claims-api -u claims-web -u nginx -f'
  # NetworkManager must not rewrite resolv.conf from DHCP.
  - path: /etc/NetworkManager/conf.d/90-ntnxlab-dns.conf
    permissions: "0644"
    content: |
      [main]
      dns=none
  # Downloads the offline bundle at first boot from the latest public GitHub release,
  # checks its SHA-256, and extracts it. BUNDLE_TAG pins a release. Without internet, set
  # BUNDLE_URL to an internal copy (with <url>.sha256 next to it, or set BUNDLE_SHA256),
  # or to "" and copy the bundle with scp. On failure, /var/lib/claims-desk/bundle-failed
  # says why and vm-ready is not written. Re-run by hand with: sudo claims-desk-fetch-bundle
  - path: /usr/local/sbin/claims-desk-fetch-bundle
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      REPO=apjgase/claims-desk-demo
      BUNDLE_TAG="${BUNDLE_TAG:-latest}"        # EDIT (optional): a release tag, e.g. v0.4.0
      BUNDLE_URL="${BUNDLE_URL-github}"         # EDIT (optional): internal copy, or "" for scp
      BUNDLE_SHA256="${BUNDLE_SHA256:-}"        # EDIT (optional): when no <url>.sha256 is published
      state=/var/lib/claims-desk
      dest=/opt/claims-desk-bundle
      mkdir -p "$state" "$dest"

      fail() {
        echo "ERROR: $*" | tee "$state/bundle-failed" >&2
        echo "fix the cause, then re-run: sudo claims-desk-fetch-bundle" >&2
        exit 1
      }
      # vm-ready needs the rest of first boot too; runcmd writes prep-done before calling this.
      ready() {
        rm -f "$state/bundle-failed"
        if [ -f "$state/prep-done" ]; then date -Is > "$state/vm-ready"; fi
      }

      if [ -z "$BUNDLE_URL" ]; then
        echo "BUNDLE_URL is empty: copy the bundle with scp"
        ready
        exit 0
      fi

      if [ "$BUNDLE_URL" = github ]; then
        if [ "$BUNDLE_TAG" = latest ]; then
          api="https://api.github.com/repos/${REPO}/releases/latest"
        else
          api="https://api.github.com/repos/${REPO}/releases/tags/${BUNDLE_TAG}"
        fi
        release="$(curl -fsSL --retry 3 --connect-timeout 10 -H 'Accept: application/vnd.github+json' "$api")" \
          || fail "could not read ${api}"
        BUNDLE_URL="$(printf '%s' "$release" | python3 -c '
      import json, re, sys
      for asset in json.load(sys.stdin).get("assets", []):
          if re.fullmatch(r"claims-desk-demo-[0-9][0-9A-Za-z.+-]*\.tar\.gz", asset["name"]):
              print(asset["browser_download_url"])
              break
      ')" || BUNDLE_URL=""
        [ -n "$BUNDLE_URL" ] || fail "release ${BUNDLE_TAG} of ${REPO} has no claims-desk-demo-*.tar.gz asset"
      fi

      if [ -z "$BUNDLE_SHA256" ]; then
        BUNDLE_SHA256="$(curl -fsSL --retry 3 --connect-timeout 10 "${BUNDLE_URL}.sha256" | awk 'NR==1 {print $1}')" \
          || fail "no checksum at ${BUNDLE_URL}.sha256. Publish one there, or set BUNDLE_SHA256."
      fi
      BUNDLE_SHA256="${BUNDLE_SHA256,,}"
      [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "checksum '${BUNDLE_SHA256}' is not a SHA-256 digest"

      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      echo "downloading ${BUNDLE_URL}"
      curl -fsSL --retry 3 --connect-timeout 10 --max-time 600 -o "$tmp/bundle.tar.gz" "$BUNDLE_URL" \
        || fail "could not download ${BUNDLE_URL}"
      echo "${BUNDLE_SHA256}  ${tmp}/bundle.tar.gz" | sha256sum --check --quiet \
        || fail "checksum mismatch for ${BUNDLE_URL} (expected ${BUNDLE_SHA256})"
      top="$(tar -tzf "$tmp/bundle.tar.gz" | sed -n '1s#/.*##p')" || fail "${BUNDLE_URL} is not a gzip tar"
      [[ "$top" =~ ^claims-desk-demo-[0-9][0-9A-Za-z.+-]*$ ]] || fail "unexpected bundle layout: '${top}'"
      tar -xzf "$tmp/bundle.tar.gz" -C "$dest" || fail "could not extract ${BUNDLE_URL}"
      ready
      echo "bundle verified and extracted; run: cd ${dest}/${top} && sudo ./update.sh --stage 1"

runcmd:
  # Replace the NetworkManager symlink with a file. dns=none keeps DHCP from putting it back.
  - [sh, -c, "rm -f /etc/resolv.conf; printf 'search ntnxlab.local\\nnameserver 10.55.19.6\\n' > /etc/resolv.conf; systemctl reload NetworkManager || true"]
  # SELinux: off now, and off after the reboot. On RHEL 9 the config file alone leaves
  # SELinux loaded without a policy; the selinux=0 kernel argument disables it fully.
  - [sh, -c, "setenforce 0 || true"]
  - [sed, -i, "s/^SELINUX=.*/SELINUX=disabled/", /etc/selinux/config]
  - [grubby, --update-kernel, ALL, --args, selinux=0]
  # Firewall: stop and mask firewalld (cloud images may not ship it; both steps tolerate that).
  - [sh, -c, "systemctl disable --now firewalld 2>/dev/null || true"]
  - [systemctl, mask, firewalld]
  - [sh, -c, "sshd -t && systemctl restart sshd"]
  - [mkdir, -p, /var/lib/claims-desk]
  - [sh, -c, "date -Is > /var/lib/claims-desk/prep-done"]
  # Keep this last: its exit status is the runcmd result, so a failed bundle download
  # shows as an error in cloud-init status. It writes vm-ready on success.
  - [/usr/local/sbin/claims-desk-fetch-bundle]

# Reboot once, to load the updated kernel and boot with selinux=0.
power_state:
  mode: reboot
  delay: now
  message: "Claims Desk VM prepared; rebooting"
  timeout: 60
  condition: true
