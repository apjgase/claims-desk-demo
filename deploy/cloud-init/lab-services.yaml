#cloud-config
# Claims Desk lab services VM (lab01): DNS for claims.internal, NTP for the lab, and the
# admin jump host. Rocky Linux 9 GenericCloud image on AHV.
#
# Size: 4 vCPU, 16 GB RAM, 60 GB disk. NIC on the management network with a fixed IP:
# pick the address in Prism when you attach the NIC (EDIT below to match). Then set this
# address as the DNS and NTP server in every subnet's IPAM settings, in Prism Central and
# Prism Element, in NDB, Files and Objects, and for NKP.
#
# Prism Central: Create VM > Guest Customization > Cloud-init (Linux) > Custom Script.
# Progress: sudo tail -f /var/log/cloud-init-output.log. Ready when the VM has rebooted
# and /var/lib/claims-desk/vm-ready exists.
#
# On the VM:
#   lab-dns add NAME IP[,IP] [ALIAS]  A + PTR records in claims.internal (several IPs: round robin)
#   lab-dns wildcard NAME IP          *.NAME.claims.internal, e.g. lab-dns wildcard apps 10.10.120.150
#   lab-dns del NAME | list | test NAME
#   chronyc clients                   who is taking time from this VM

